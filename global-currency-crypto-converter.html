<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Currency & Crypto Converter</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f8fafc;color:#0f172a}.card{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0001}input,select,button{padding:12px;border-radius:10px;border:1px solid #cbd5e1;margin:5px}button{background:#2563eb;color:#fff;cursor:pointer}.result{font-size:28px;font-weight:800;margin-top:20px}small{color:#64748b}</style></head><body><div class="card"><h1>🌍 Global Currency & Crypto Converter</h1><p>Live exchange-rate converter with fiat and crypto support.</p><label>Amount<br><input id="amount" type="number" value="1" min="0" step="any"></label><br><label>From <select id="from"><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option><option>JPY</option><option>AUD</option><option>CAD</option><option>SGD</option><option>BTC</option><option>ETH</option><option>SOL</option></select></label><label>To <select id="to"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option><option>AUD</option><option>CAD</option><option>SGD</option><option>BTC</option><option>ETH</option><option>SOL</option></select></label><br><button id="convert">Get Exchange Rate</button><div class="result" id="result">Ready</div><small id="status">Loading live rates…</small></div><script>const crypto={BTC:'bitcoin',ETH:'ethereum',SOL:'solana'};let fx={};let prices={};async function load(){try{let r=await fetch('https://api.frankfurter.app/latest?from=EUR');let j=await r.json();fx={EUR:1,...j.rates}}catch(e){}try{let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd,eur,gbp,inr,jpy,aud,cad,sgd');prices=await r.json()}catch(e){}document.getElementById('status').textContent='Live rates loaded when APIs are available; offline use may be unavailable.'}function fiat(a,b){if(a===b)return 1;if(!fx[a]||!fx[b])return null;return fx[b]/fx[a]}function rate(a,b){if(crypto[a]){let p=prices[crypto[a]];if(!p)return null;if(crypto[b]){let q=prices[crypto[b]];return q?p.usd/q.usd:null}return p[b.toLowerCase()]||null}if(crypto[b]){let p=prices[crypto[b]];if(!p)return null;let usd=a==='USD'?1:fiat(a,'USD');return usd/p.usd}return fiat(a,b)}document.getElementById('convert').onclick=()=>{let a=+document.getElementById('amount').value,f=document.getElementById('from').value,t=document.getElementById('to').value,r=rate(f,t);document.getElementById('result').textContent=r?new Intl.NumberFormat(undefined,{maximumFractionDigits:8}).format(a*r)+' '+t:'Rate unavailable'};load();</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Apex Exchange — Global Currency & Crypto Converter</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:auto;padding:24px;background:#0b1220;color:#eef5ff}.card{background:#121b2b;border:1px solid #243451;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0005}.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand img{width:240px;height:auto;max-width:75%}h1{font-size:clamp(28px,5vw,46px);margin:16px 0 8px}p{color:#a9b8cf}input,select,button{padding:12px;border-radius:10px;border:1px solid #314463;margin:5px;background:#0d1625;color:#eef5ff}input{width:180px}button{background:linear-gradient(90deg,#079cf2,#5b27e8);border:0;cursor:pointer;font-weight:700}.result{font-size:28px;font-weight:800;margin-top:20px;color:#67d9ff}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#102a38;color:#64e6b0;font-size:12px}.footer{margin-top:20px;font-size:12px;color:#71839e}</style></head><body><div class="card"><div class="brand"><img src="./apex-exchange-logo.svg" alt="Apex Exchange logo"></div><span class="pill">● LIVE RATES</span><h1>Global Currency & Crypto Converter</h1><p>Fast currency and crypto conversion with transparent rates and an Apex Exchange branded interface.</p><div class="row"><label>Amount<br><input id="amount" type="number" value="1" min="0" step="any"></label><label>From<br><select id="from"><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option><option>JPY</option><option>AUD</option><option>CAD</option><option>SGD</option><option>BTC</option><option>ETH</option><option>SOL</option></select></label><label>To<br><select id="to"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option><option>AUD</option><option>CAD</option><option>SGD</option><option>BTC</option><option>ETH</option><option>SOL</option></select></label><button id="swap" type="button">↕ Swap</button><button id="convert" type="button">Convert Now</button></div><div class="result" id="result">Ready</div><p id="rateLine">—</p><small id="status">Loading live rates…</small><div class="footer">Apex Exchange • Currency & Crypto Tools • Rates supplied by external market-data APIs.</div></div><script>const crypto={BTC:'bitcoin',ETH:'ethereum',SOL:'solana'};let fx={};let prices={};async function load(){try{let r=await fetch('https://api.frankfurter.app/latest?from=EUR');let j=await r.json();fx={EUR:1,...j.rates}}catch(e){}try{let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd,eur,gbp,inr,jpy,aud,cad,sgd');prices=await r.json()}catch(e){}document.getElementById('status').textContent='Rates loaded when market-data APIs are available.'}function fiat(a,b){if(a===b)return 1;if(!fx[a]||!fx[b])return null;return fx[b]/fx[a]}function rate(a,b){if(crypto[a]){let p=prices[crypto[a]];if(!p)return null;if(crypto[b]){let q=prices[crypto[b]];return q?p.usd/q.usd:null}return p[b.toLowerCase()]||null}if(crypto[b]){let p=prices[crypto[b]];if(!p)return null;let usd=a==='USD'?1:fiat(a,'USD');return usd/p.usd}return fiat(a,b)}function convert(){let a=+document.getElementById('amount').value,f=document.getElementById('from').value,t=document.getElementById('to').value,r=rate(f,t);document.getElementById('result').textContent=r!==null?new Intl.NumberFormat(undefined,{maximumFractionDigits:8}).format(a*r)+' '+t:'Rate unavailable';document.getElementById('rateLine').textContent=r!==null?'1 '+f+' = '+new Intl.NumberFormat(undefined,{maximumFractionDigits:10}).format(r)+' '+t:'Try again when rates are available'}document.getElementById('convert').onclick=convert;document.getElementById('swap').onclick=()=>{let f=document.getElementById('from'),t=document.getElementById('to');[f.value,t.value]=[t.value,f.value];convert()};load();</script></body></html>
